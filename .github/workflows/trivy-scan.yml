name: Trivy image scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: my-first-app
            context: my-first-app
          - name: backend-service
            context: microservices/backend
          - name: frontend-service
            context: microservices/frontend
    steps:
      - name: Check out repository code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build a throwaway copy of the image
        run: docker build -t ${{ matrix.name }}:scan ${{ matrix.context }}

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
