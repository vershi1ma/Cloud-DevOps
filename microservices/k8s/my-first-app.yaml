apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-first-app
  annotations:
    checkov.io/skip1: CKV_K8S_23=nginx must start as root to bind port 80, phase 2
    checkov.io/skip2: CKV_K8S_40=nginx must start as root to bind port 80, phase 2
    checkov.io/skip3: CKV_K8S_22=nginx writes cache and pid files, phase 2
    checkov.io/skip4: CKV_K8S_37=dropping all capabilities can break nginx user switch, phase 2
    checkov.io/skip5: CKV_K8S_28=dropping all capabilities can break nginx user switch, phase 2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-first-app
  template:
    metadata:
      labels:
        app: my-first-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: my-first-app
          image: my-first-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: my-first-app-service
spec:
  selector:
    app: my-first-app
  ports:
    - port: 80
      targetPort: 80
